[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-compliance-checker"
version = "0.1.0"
description = "RAG-based PDF compliance checker and summarizer"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "pypdf>=3.17.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.2",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
]

[tool.uv]
python-version = "3.11"
